# Runs on every push to main and every pull request, so a type error or a
# clippy warning is caught here rather than on the release branch.
#
# The Rust side runs on all three platforms deliberately: a good deal of
# src-tauri is behind `#[cfg(target_os = ...)]` - the macOS menu bar, the
# Windows backdrop - and a check on one platform never compiles the others.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes whatever was already running for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: typecheck and build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: install dependencies
        run: bun install --frozen-lockfile

      # `bun run build` is `tsc && vite build`, so this is the typecheck too.
      - name: build
        run: bun run build

  lint:
    name: eslint and prettier
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: install dependencies
        run: bun install --frozen-lockfile

      # Errors fail the job; warnings do not. react-hooks v7 added two rules
      # that flag patterns this codebase uses deliberately, and those are set
      # to warn until the call sites have been worked through.
      - name: eslint
        run: bun run lint

      - name: prettier
        run: bun run format:check

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Formatting compiles nothing, so this needs no system dependencies and
      # no cache - it is the cheapest check here and fails in seconds.
      - name: cargo fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

  rust:
    name: clippy (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Tauri builds a lot of crates; without this every run starts cold.
      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The same set the release workflow installs.
      - name: install system dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
