name: 'publish'

on:
  push:
    branches:
      - release

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm based macs (M1 and above).
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel based macs.
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Automatically add the targets for Apple Silicon and Intel if building on Mac
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: install app dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          tagName: app-v__VERSION__ # the action automatically replaces \_\_VERSION\_\_ with the app version.
          releaseName: 'Nuza v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
          # Every leg of this matrix runs at once, and each one would read, merge
          # and re-upload the same latest.json on the same release. That races:
          # a job can delete a manifest another job has already replaced, which
          # fails with a 404 and - worse - can publish a manifest missing the
          # platform whose job lost the race. publish-updater builds it once
          # instead, after every build has uploaded its artifacts.
          includeUpdaterJson: false

  publish-updater:
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4
      
      - name: Build the updater manifest from the release signatures
        # The build jobs no longer write latest.json (they'd race each other for
        # it), so assemble it here from every platform's .sig now that all of
        # them have uploaded. The script refuses to emit a manifest that's
        # missing a platform, so a half-published release fails loudly instead
        # of leaving those users with no update.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p public

          # tauri.conf.json is authoritative for the release tag
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          TAG_NAME="app-v$VERSION"
          NOTES=$(gh release view "$TAG_NAME" -R "$GITHUB_REPOSITORY" --json body -q .body 2>/dev/null || echo "")

          # Assets can lag a little behind the jobs that uploaded them.
          for i in $(seq 1 15); do
            rm -rf sigs && mkdir -p sigs
            gh release download "$TAG_NAME" -R "$GITHUB_REPOSITORY" -p "*.sig" -D sigs 2>/dev/null || true

            if python3 .github/scripts/build-updater-manifest.py \
                --sig-dir sigs \
                --version "$VERSION" \
                --tag "$TAG_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --notes "$NOTES" \
                --output public/updater.json; then
              jq '.platforms | keys' public/updater.json
              exit 0
            fi

            echo "signatures incomplete, retrying in 10s... ($i/15)"
            sleep 10
          done

          echo "Error: the release never had a complete set of signatures"
          exit 1

      - name: Attach the manifest to the release
        # Keeps latest.json on the release itself, as it was when tauri-action
        # published it - only now there's a single writer.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          cp public/updater.json latest.json
          gh release upload "app-v$VERSION" latest.json -R "$GITHUB_REPOSITORY" --clobber

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: nuza-update.puang.in
          keep_files: false

      - name: Redeploy nuza.puang.in so its changelog picks up this release
        # nuza-website reads GitHub Releases at Astro build time (see src/lib/changelog.ts),
        # so a new nuza release doesn't show up there until the site is rebuilt. This hits
        # a Vercel Deploy Hook (Project Settings > Git > Deploy Hooks on nuza-website) to
        # trigger that rebuild. Skips quietly if the hook hasn't been configured yet.
        env:
          HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret not set - skipping nuza-website redeploy"
            exit 0
          fi
          curl -fsS -X POST "$HOOK_URL"
