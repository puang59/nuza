[package]
name = "nuza"
version = "0.5.0"
description = "A fast, privacy-first, local-first markdown notes app"
authors = ["puang59"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nuza_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# No "protocol-asset": a note's media goes over nuza-media:// instead, which
# is scoped to the open folder rather than to every folder ever opened.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
window-vibrancy = "0.8.0"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2.12.0"
tauri-plugin-process = "2"
fontdb = "0.24.0"
ttf-parser = "0.25"
# Notes are written to a temporary file and renamed over the target, so a
# crash mid-save cannot truncate one.
tempfile = "3"
# Notices a note being changed underneath the app - by a sync client, a
# git checkout, or another editor.
notify = "8"
# The content search's regular-expression mode. Already compiled into the app
# by tauri; this asks for it by name.
regex = "1"
# Deleting a note puts it in the Trash, the Recycle Bin or the XDG trash
# rather than unlinking it - the app has no undo, and the OS does.
trash = "5"
# Serving the images and video a note points at, over nuza-media:// rather
# than through Tauri's asset protocol - see `serve_media`. All three already
# came in under tauri; these are the same versions, asked for by name.
percent-encoding = "2"
http-range = "0.1"
tauri-utils = "2"
# `oneshot`, so a command waiting on a file dialog yields its thread rather
# than parking it for as long as the dialog is open - see `wait_for_picker`.
tokio = { version = "1", features = ["sync"] }

# `nuza <path>` while the app is already open hands the path to the open
# window rather than starting a second one. Desktop only, like the command.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

# A rename that refuses to replace what is already there. Every platform has
# one and none of them is `fs::rename`, which is why these are here.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Which Windows this is, so the window gets the backdrop that does not make
# dragging it crawl. window-vibrancy reads the same crate for the same reason.
# windows-sys is for MoveFileExW, for the same reason libc is above.
[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
] }


# A window without a screen, so a test can stand two of them up and check that
# what one opens is not what the other sees. Test builds only, and not on
# Windows: a test executable there has no application manifest, and with the
# webview linked in it fails to start (STATUS_ENTRYPOINT_NOT_FOUND).
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
